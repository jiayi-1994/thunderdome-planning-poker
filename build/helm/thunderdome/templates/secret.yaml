{{- if not .Values.secrets.existingSecret }}
{{- $name := include "thunderdome.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- $specified := dict "DB_PASS" .Values.secrets.databasePassword "COOKIE_HASHKEY" .Values.secrets.cookieHashKey "CONFIG_AES_HASHKEY" .Values.secrets.aesHashKey }}
{{- range $key, $value := $specified }}
  {{- if $existing }}
    {{- $saved := required (printf "Existing Secret %s lacks %s; restore the original value before upgrading" $name $key) (index (default dict $existing.data) $key) }}
    {{- if and $value (ne ($value | b64enc) $saved) }}
      {{- fail (printf "Refusing to change %s in existing Secret %s; rotate database/encryption credentials separately" $key $name) }}
    {{- end }}
    {{- $_ := set $data $key $saved }}
  {{- else }}
    {{- if and (eq $key "DB_PASS") (not $.Values.postgresql.enabled) (not $value) }}
      {{- fail "External database requires secrets.databasePassword or secrets.existingSecret" }}
    {{- end }}
    {{- $length := ternary 64 32 (eq $key "COOKIE_HASHKEY") }}
    {{- $_ := set $data $key (default (randAlphaNum $length) $value | b64enc) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "thunderdome.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
